<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .axis{stroke:#5f5e5a;stroke-width:1;stroke-dasharray:2 3}
  .curve{fill:none;stroke:#2F6F4E;stroke-width:2.5;stroke-linecap:round}
  .dot{fill:#639922}
  .formula{font-family:'Courier New',monospace;font-size:15px;fill:#639922;opacity:0}
  @media (prefers-color-scheme: light){
    .axis{stroke:#B4B2A9}
    .curve{stroke:#173404}
    .dot{fill:#3B6D11}
    .formula{fill:#173404}
  }
</style>

<line class="axis" x1="20" y1="170" x2="540" y2="170"/>
<line class="axis" x1="280" y1="20" x2="280" y2="170"/>

<path class="curve" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"
  d="M 40 168
     C 120 168, 160 168, 195 150
     C 230 130, 245 40, 280 30
     C 315 40, 330 130, 365 150
     C 400 168, 440 168, 520 168">
  <animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
</path>

<circle class="dot" r="4" cx="40" cy="168">
  <animateMotion dur="2.5s" begin="0.3s" fill="freeze"
    path="M 40 168 C 120 168, 160 168, 195 150 C 230 130, 245 40, 280 30 C 315 40, 330 130, 365 150 C 400 168, 440 168, 520 168"/>
</circle>

<text id="formula" class="formula" x="235" y="195">N(μ, σ²)</text>
<set xlink:href="#formula" attributeName="opacity" to="1" begin="2.9s" fill="freeze"/>
</svg>
