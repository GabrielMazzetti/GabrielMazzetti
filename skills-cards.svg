<svg width="620" height="90" viewBox="0 0 620 90" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .card{fill:none;stroke:#2F6F4E;stroke-width:1.5}
